<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Landing Page Generator</title>
    <style>
        body { font-family: system-ui; background: #0d1117; color: #c9d1d9; text-align: center; padding: 50px; }
        h1 { font-size: 3rem; background: linear-gradient(135deg, #f0f6fc, #58a6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 800px; margin: 40px auto; }
        .feature { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
        .btn { display: inline-block; padding: 12px 30px; background: #2ea043; color: white; text-decoration: none; border-radius: 40px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🚀 Landing Page Generator</h1>
    <p style="font-size: 1.2rem; color: #8b949e;">Premium landing pages for 20+ categories</p>
    <div class="features">
        <div class="feature">🏡 Real Estate</div>
        <div class="feature">🛒 E-commerce</div>
        <div class="feature">☁️ SaaS</div>
        <div class="feature">🏥 Healthcare</div>
        <div class="feature">📚 Education</div>
        <div class="feature">💰 Fintech</div>
        <div class="feature">✈️ Travel</div>
        <div class="feature">👗 Fashion</div>
    </div>
    <a href="https://github.com/softappweber/lpgenet" class="btn">⭐ View on GitHub</a>
</body>
</html>
