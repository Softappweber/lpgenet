<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🚀 Landing Page Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; width: 100%; }
        .panel { background: #161b22; border-radius: 16px; padding: 24px; border: 1px solid #30363d; }
        .panel h2 { font-size: 1.2rem; margin-bottom: 16px; color: #f0f6fc; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #8b949e; margin-bottom: 4px; }
        .form-group select, .form-group input { width: 100%; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 0.9rem; }
        .form-group select:focus, .form-group input:focus { outline: none; border-color: #58a6ff; }
        .sections-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 150px; overflow-y: auto; padding: 4px; }
        .sections-grid label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #c9d1d9; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
        .sections-grid label:hover { background: #21262d; }
        .sections-grid input[type="checkbox"] { accent-color: #58a6ff; width: 14px; height: 14px; }
        .btn { width: 100%; padding: 10px; background: #2ea043; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #3fb950; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; }
        .preview-box { background: #0d1117; border-radius: 8px; padding: 16px; min-height: 400px; border: 1px solid #30363d; margin-top: 12px; overflow-y: auto; }
        .preview-box .placeholder { color: #8b949e; text-align: center; padding: 40px 0; }
        .preview-box .lp { padding: 12px; border-radius: 8px; }
        .preview-box .lp .section { padding: 12px; margin: 8px 0; border-radius: 6px; background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent, #58a6ff); }
        .preview-box .lp .section h4 { font-size: 0.9rem; margin-bottom: 4px; }
        .preview-box .lp .section p { font-size: 0.8rem; opacity: 0.8; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: 600; background: #21262d; color: #8b949e; }
        .flex { display: flex; gap: 8px; }
        .flex .btn { width: auto; flex: 1; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h2>⚙️ Configure</h2>
        <div class="form-group"><label>Category</label><select id="category"></select></div>
        <div class="form-group"><label>Theme</label><select id="theme"></select></div>
        <div class="form-group"><label>Brand Name</label><input id="brand" value="Nova" /></div>
        <div class="form-group"><label>Sections</label><div id="sectionsGrid" class="sections-grid"></div></div>
        <button class="btn" id="generateBtn">🚀 Generate Landing Page</button>
        <div style="margin-top:8px;"><button class="btn btn-secondary" id="downloadBtn">⬇️ Download HTML</button></div>
    </div>
    <div class="panel">
        <h2>👁️ Preview</h2>
        <div id="previewBox" class="preview-box"><div class="placeholder">Select options and click Generate</div></div>
    </div>
</div>
<script>
const categories = [
    { id: 'real-estate', name: 'Real Estate', icon: '🏡', desc: 'Premium property showcase' },
    { id: 'ecommerce', name: 'E-commerce', icon: '🛒', desc: 'Online store landing' },
    { id: 'saas', name: 'SaaS', icon: '☁️', desc: 'Software as a Service' },
    { id: 'healthcare', name: 'Healthcare', icon: '🏥', desc: 'Medical services' },
    { id: 'education', name: 'Education', icon: '📚', desc: 'Learning platform' },
    { id: 'fintech', name: 'Fintech', icon: '💰', desc: 'Financial technology' },
    { id: 'travel', name: 'Travel', icon: '✈️', desc: 'Tourism and travel' },
    { id: 'fashion', name: 'Fashion', icon: '👗', desc: 'Fashion brand' },
    { id: 'food', name: 'Food & Beverage', icon: '🍔', desc: 'Restaurant and food' },
    { id: 'fitness', name: 'Fitness', icon: '💪', desc: 'Gym and fitness' },
    { id: 'beauty', name: 'Beauty', icon: '💄', desc: 'Beauty and skincare' },
    { id: 'automotive', name: 'Automotive', icon: '🚗', desc: 'Car dealership' },
    { id: 'entertainment', name: 'Entertainment', icon: '🎬', desc: 'Media and events' },
    { id: 'nonprofit', name: 'Nonprofit', icon: '🤝', desc: 'Charity and causes' },
    { id: 'consulting', name: 'Consulting', icon: '🧠', desc: 'Business consulting' },
    { id: 'technology', name: 'Technology', icon: '💻', desc: 'Tech company' },
    { id: 'insurance', name: 'Insurance', icon: '🛡️', desc: 'Insurance services' },
    { id: 'marketing', name: 'Marketing', icon: '📢', desc: 'Digital marketing' },
    { id: 'advertising', name: 'Advertising', icon: '📣', desc: 'Ad agency' }
];
const themes = [
    { id: 'premium', name: 'Premium', primary: '#0f2027', accent: '#ffd700', bg: '#ffffff', text: '#0f2027' },
    { id: 'modern', name: 'Modern', primary: '#0f172a', accent: '#3b82f6', bg: '#ffffff', text: '#0f172a' },
    { id: 'dark', name: 'Dark', primary: '#0f0f0f', accent: '#ffd700', bg: '#1a1a1a', text: '#f1f5f9' },
    { id: 'elegant', name: 'Elegant', primary: '#2c1810', accent: '#c9a96e', bg: '#faf5f0', text: '#2c1810' },
    { id: 'luxury', name: 'Luxury', primary: '#1a0a2e', accent: '#ffd700', bg: '#faf5ff', text: '#1a0a2e' },
    { id: 'light', name: 'Light', primary: '#ffffff', accent: '#0f172a', bg: '#ffffff', text: '#0f172a' },
    { id: 'neon', name: 'Neon', primary: '#0f172a', accent: '#22d3ee', bg: '#0f172a', text: '#a5f3fc' },
    { id: 'pastel', name: 'Pastel', primary: '#fdf2f8', accent: '#db2777', bg: '#fdf2f8', text: '#831843' },
    { id: 'corporate', name: 'Corporate', primary: '#0f2027', accent: '#e2e8f0', bg: '#f1f5f9', text: '#0f2027' },
    { id: 'creative', name: 'Creative', primary: '#fff7ed', accent: '#f97316', bg: '#fff7ed', text: '#1c1917' },
    { id: 'tech', name: 'Tech', primary: '#f0f9ff', accent: '#0284c7', bg: '#f0f9ff', text: '#0f172a' },
    { id: 'nature', name: 'Nature', primary: '#ecfdf5', accent: '#10b981', bg: '#ecfdf5', text: '#064e3b' },
    { id: 'vintage', name: 'Vintage', primary: '#fef9e7', accent: '#a67c52', bg: '#fef9e7', text: '#4a3728' },
    { id: 'glass', name: 'Glassmorphism', primary: 'rgba(255,255,255,0.3)', accent: '#6366f1', bg: 'rgba(255,255,255,0.3)', text: '#0f172a' },
    { id: 'futuristic', name: 'Futuristic', primary: '#0b1120', accent: '#06b6d4', bg: '#0b1120', text: '#cbd5e1' },
    { id: 'bold', name: 'Bold', primary: '#0c0a1e', accent: '#ef4444', bg: '#0c0a1e', text: '#f8fafc' },
    { id: 'clean', name: 'Clean', primary: '#ffffff', accent: '#3b82f6', bg: '#ffffff', text: '#0f172a' },
    { id: 'gradient', name: 'Gradient', primary: 'linear-gradient(145deg, #f0f4ff, #e6edf9)', accent: '#7c3aed', bg: 'linear-gradient(145deg, #f0f4ff, #e6edf9)', text: '#1e293b' },
    { id: 'retro', name: 'Retro', primary: '#fef3c7', accent: '#d97706', bg: '#fef3c7', text: '#451a03' },
    { id: 'playful', name: 'Playful', primary: '#fdf2f8', accent: '#ec4899', bg: '#fdf2f8', text: '#4c0519' }
];
const sections = [
    { id: 'hero', name: 'Hero', icon: '🏠' }, { id: 'features', name: 'Features', icon: '⭐' },
    { id: 'testimonials', name: 'Testimonials', icon: '💬' }, { id: 'pricing', name: 'Pricing', icon: '💰' },
    { id: 'about', name: 'About', icon: '📖' }, { id: 'cta', name: 'Call to Action', icon: '📢' },
    { id: 'gallery', name: 'Gallery', icon: '🖼️' }, { id: 'contact', name: 'Contact', icon: '📧' },
    { id: 'blog', name: 'Blog', icon: '📝' }, { id: 'stats', name: 'Stats', icon: '📊' },
    { id: 'team', name: 'Team', icon: '👥' }, { id: 'faq', name: 'FAQ', icon: '❓' },
    { id: 'timeline', name: 'Timeline', icon: '⏰' }, { id: 'clients', name: 'Clients', icon: '🤝' },
    { id: 'promo', name: 'Promo', icon: '🎁' }
];
const categoryEl = document.getElementById('category');
const themeEl = document.getElementById('theme');
const brandEl = document.getElementById('brand');
const sectionsGrid = document.getElementById('sectionsGrid');
const previewBox = document.getElementById('previewBox');
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
let selectedSections = ['hero', 'features', 'testimonials', 'cta'];

categories.forEach(c => { const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.icon + ' ' + c.name; categoryEl.appendChild(opt); });
themes.forEach(t => { const opt = document.createElement('option'); opt.value = t.id; opt.textContent = t.name; themeEl.appendChild(opt); });
sections.forEach(s => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = s.id;
    cb.checked = selectedSections.includes(s.id);
    cb.addEventListener('change', () => {
        if (cb.checked) { if (!selectedSections.includes(s.id)) selectedSections.push(s.id); }
        else { selectedSections = selectedSections.filter(id => id !== s.id); }
        renderPreview();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(s.icon + ' ' + s.name));
    sectionsGrid.appendChild(label);
});

function renderPreview() {
    const cat = categories.find(c => c.id === categoryEl.value) || categories[0];
    const theme = themes.find(t => t.id === themeEl.value) || themes[0];
    const brand = brandEl.value || 'Nova';
    const sel = selectedSections.map(id => sections.find(s => s.id === id)).filter(Boolean);
    let html = `<div class="lp" style="background:${theme.bg}; color:${theme.text}; padding:16px; border-radius:8px;">`;
    html += `<h2 style="color:${theme.primary};">${brand}</h2><p style="color:${theme.accent};">${cat.icon} ${cat.name}</p><p style="font-size:0.8rem; opacity:0.7;">${cat.desc}</p>`;
    sel.forEach(s => {
        html += `<div class="section" style="border-left-color:${theme.accent};"><h4>${s.icon} ${s.name}</h4><p>Content for ${s.name} section</p></div>`;
    });
    html += `<div style="margin-top:12px; padding:8px; background:${theme.accent}; color:${theme.primary}; text-align:center; border-radius:4px; font-weight:600;">Generated with ❤️</div>`;
    html += `</div>`;
    previewBox.innerHTML = html;
}

function generateHTML() {
    const cat = categories.find(c => c.id === categoryEl.value) || categories[0];
    const theme = themes.find(t => t.id === themeEl.value) || themes[0];
    const brand = brandEl.value || 'Nova';
    const sel = selectedSections.map(id => sections.find(s => s.id === id)).filter(Boolean);
    let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${brand} - Landing Page</title><style>body{font-family:system-ui;margin:0;padding:20px;background:${theme.bg};color:${theme.text};}.container{max-width:800px;margin:0 auto;}.section{padding:16px;margin:12px 0;border-radius:8px;background:rgba(255,255,255,0.05);border-left:4px solid ${theme.accent};}.btn{display:inline-block;padding:10px 24px;background:${theme.accent};color:${theme.primary};text-decoration:none;border-radius:6px;font-weight:600;}</style></head><body><div class="container"><h1 style="color:${theme.primary};">${brand}</h1><p style="color:${theme.accent};">${cat.icon} ${cat.name}</p><p>${cat.desc}</p>`;
    sel.forEach(s => { html += `<div class="section"><h3>${s.icon} ${s.name}</h3><p>Content for ${s.name} section</p></div>`; });
    html += `<div style="margin-top:20px; padding:12px; background:${theme.accent}; color:${theme.primary}; text-align:center; border-radius:6px;">Generated with ❤️</div></div></body></html>`;
    return html;
}

generateBtn.addEventListener('click', renderPreview);
downloadBtn.addEventListener('click', () => {
    const html = generateHTML();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'landing-page.html'; a.click(); URL.revokeObjectURL(url);
});
[categoryEl, themeEl, brandEl].forEach(el => el.addEventListener('change', renderPreview));
renderPreview();
</script>
</body>
</html>
